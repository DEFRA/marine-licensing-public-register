services:
  redis:
    image: redis:7.2.3-alpine3.18
    ports:
      - '6379:6379'
    networks:
      - cdp-tenant

  mongodb:
    # Single-member replica set so local dev supports Mongo transactions,
    # matching the replica sets in all deployed environments. The healthcheck
    # initiates the set: it retries until mongod is up, rs.initiate() runs
    # once, and rs.status() succeeds thereafter, so healthy implies the set
    # is initiated and writable.
    image: mongo:7.0.28
    command: ['--replSet', 'rs0', '--bind_ip_all']
    networks:
      - cdp-tenant
    ports:
      - '27017:27017'
    volumes:
      - ./compose/mongo:/docker-entrypoint-initdb.d:ro
      - mongodb-data:/data
    restart: always
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }"
        ]
      interval: 5s
      timeout: 30s
      start_period: 5s
      start_interval: 1s
      retries: 30

  ################################################################################

  # Local AWS (SNS/SQS) is provided by LocalStack from marine-licensing-backend
  # compose (shared cdp-tenant network). Start that stack first so the
  # marine_licensing_public_register topic/queue/subscription exist.
  marine-licensing-public-register:
    build:
      context: .
      target: development
    ports:
      - '3001:3001'
    links:
      - 'mongodb:mongodb'
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - 'compose/aws.env'
    environment:
      PORT: 3001
      NODE_ENV: development
      MONGO_URI: mongodb://mongodb:27017/
      SQS_ENDPOINT: http://localstack:4566
    networks:
      - cdp-tenant
    volumes:
      - ./src:/home/node/src
      - ./package.json:/home/node/package.json

################################################################################

volumes:
  mongodb-data:

networks:
  cdp-tenant:
    driver: bridge
    name: cdp-tenant
